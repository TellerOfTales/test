plugins { id 'com.android.application' }

android {
    namespace 'com.tellertales.paperroute'
    compileSdk 34

    defaultConfig {
        applicationId "com.tellertales.paperroute"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // The game ships from web/index.html — one source of truth for the browser,
    // the published artifact and the APK alike.
    sourceSets {
        main { assets.srcDirs = ['src/main/assets', '../../web'] }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
